group 'africa.ejara.trustdart'
version '1.0-SNAPSHOT'


buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        jcenter()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        jcenter()
        maven {
            url = uri("https://maven.pkg.github.com/trustwallet/wallet-core")
            credentials {
                username = System.getenv("TRUST_DART_GITHUB_USER")
                password = System.getenv("TRUST_DART_GITHUB_TOKEN")
            }
        }
    }


}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

kotlin {
    jvmToolchain(17)
}

android {
    namespace 'africa.ejara.trustdart'
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
    }

    dependencies {
        implementation "com.trustwallet:wallet-core:4.3.23"
        implementation "com.swmansion.starknet:starknet:0.16.1"
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "org.jetbrains.kotlin:kotlin-script-runtime:1.5.31"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
}
